name: SEO and GEO quality

on:
  pull_request:
    paths:
      - "**/*.html"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "seo/**"
      - "social/topic-signals.json"
      - "scripts/generate-seo-assets.mjs"
      - "scripts/seo-audit.mjs"
      - "lighthouserc.cjs"
      - ".github/workflows/seo-geo.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "seo/**"
      - "social/topic-signals.json"
      - "scripts/generate-seo-assets.mjs"
      - "scripts/seo-audit.mjs"
      - "lighthouserc.cjs"
      - ".github/workflows/seo-geo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-geo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-audit:
    name: Static SEO and GEO audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate derived SEO assets
        run: node scripts/generate-seo-assets.mjs

      - name: Verify generated assets are committed
        run: git diff --exit-code -- sitemap.xml llms.txt

      - name: Run static SEO audit
        run: node scripts/seo-audit.mjs

  lighthouse:
    name: Lighthouse SEO smoke test
    runs-on: ubuntu-latest
    needs: seo-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x

      - name: Run Lighthouse CI
        run: lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
